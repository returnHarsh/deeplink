version: 1
frontend:
  phases:
    preBuild:
      commands:
        - env | grep -e MONGODB_URI -e JWT_SECRET >> .env.production
        - npm ci
    build:
      commands:
        - npm run build
        - rm -rf .next/cache
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
    exclude:
      - 'cache/**/*'
  cache:
    paths:
      - node_modules/**/*
